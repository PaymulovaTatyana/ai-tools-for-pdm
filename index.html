<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Кто выгуливает Бориса</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f2e8;
      --paper: #fffdf7;
      --ink: #23382d;
      --muted: #53645b;
      --line: #d8ded3;
      --green: #234a37;
      --green-soft: #e5f0e4;
      --clay: #83432c;
      --clay-soft: #f7e8dc;
      color: var(--ink);
      background: var(--page);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body, h1, h2, h3, p, ul { margin: 0; }
    [hidden] { display: none !important; }

    .shell {
      width: min(69rem, calc(100% - clamp(2rem, 8vw, 6rem)));
      margin-inline: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 1.15rem 0;
      border-bottom: 1px solid var(--line);
      font-weight: 750;
    }

    .brand-mark {
      display: inline-grid;
      width: 1.95rem;
      height: 1.95rem;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: white;
      font-size: 1rem;
    }

    .intro { padding-block: clamp(1.7rem, 5vw, 3.75rem); }
    .intro p { margin-top: 0.55rem; color: var(--muted); }
    h1, h2 {
      font-family: Georgia, serif;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    h1 { font-size: clamp(2.4rem, 6vw, 4.4rem); }
    h2 { font-size: clamp(1.5rem, 3.4vw, 2.15rem); }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
      gap: 1.25rem;
      align-items: start;
      padding-bottom: 2.5rem;
    }

    .panel {
      padding: clamp(1rem, 3vw, 1.7rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--paper);
    }

    .heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.25rem 1rem;
    }

    .date { color: var(--muted); }
    .slots {
      display: grid;
      gap: 0.6rem;
      margin-top: 1.1rem;
      padding: 0;
      list-style: none;
    }

    .slot {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.5rem 0.9rem;
      min-height: 3.7rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
    }

    .slot.occupied { background: var(--clay-soft); border-color: #ead4c7; }
    .slot time { font-size: 1.15rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .slot-state { color: var(--green); font-size: 0.9rem; font-weight: 700; }
    .occupied .slot-state { color: var(--clay); }
    .person { color: var(--ink); font-size: 0.95rem; overflow-wrap: anywhere; }

    button, input {
      min-height: 2.65rem;
      border: 1px solid var(--line);
      border-radius: 0.55rem;
      font: inherit;
    }

    button {
      padding: 0.4rem 0.85rem;
      background: var(--green);
      color: white;
      font-weight: 680;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
    .slot button { background: var(--green-soft); color: var(--ink); }
    .slot button:hover { border-color: var(--green); }

    form {
      display: grid;
      gap: 0.55rem;
      margin-top: 1rem;
    }

    form label { font-weight: 650; }

    input {
      width: 100%;
      min-width: 0;
      padding: 0.45rem 0.65rem;
      background: white;
      color: var(--ink);
    }

    form button { justify-self: start; }
    #booking-form { padding-top: 1rem; border-top: 1px solid var(--line); }
    #booking-form h3 { font-size: 1.1rem; }
    .message { margin-top: 0.8rem; }
    .message:empty { margin-top: 0; }
    .message.error { color: var(--clay); font-weight: 680; }
    .feeding { background: #ebefe4; }
    .feeding-details { margin-top: 0.85rem; }
    #feeding-name { font-weight: 750; overflow-wrap: anywhere; }
    #feeding-time { color: var(--muted); }

    @media (max-width: 47rem) {
      .dashboard { grid-template-columns: 1fr; }
    }

    @media (max-width: 23rem) {
      .slot { gap: 0.4rem; padding-inline: 0.5rem; }
      .slot button { padding-inline: 0.55rem; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand"><span class="brand-mark" aria-hidden="true">Б</span> Догяндекс</header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Кто выгуливает Бориса</h1>
        <p>Выберите свободное время и запишитесь на прогулку.</p>
      </section>

      <div class="dashboard">
        <section class="panel" aria-labelledby="walks-title">
          <div class="heading">
            <h2 id="walks-title">Прогулки на сегодня</h2>
            <time class="date" id="walk-date"></time>
          </div>
          <ul class="slots" id="slots" aria-label="Слоты прогулок"></ul>
          <p class="message" id="booking-status" role="status">Загружаем прогулки…</p>
          <form id="booking-form" hidden>
            <h3 id="booking-title"></h3>
            <label for="booking-name">ФИО</label>
            <input id="booking-name" autocomplete="off" placeholder="Анна Тестова" required>
            <button type="submit">Подтвердить запись</button>
          </form>
        </section>

        <section class="panel feeding" aria-labelledby="feeding-title">
          <h2 id="feeding-title">Последнее кормление</h2>
          <div class="feeding-details">
            <p id="feeding-name">Отметок пока нет</p>
            <time id="feeding-time" hidden></time>
          </div>
          <form id="feeding-form">
            <label for="feeding-employee">ФИО для отметки</label>
            <input id="feeding-employee" autocomplete="off" placeholder="Илья Примеров" required>
            <button type="submit">Отметить кормление</button>
          </form>
          <p class="message" id="feeding-status" role="status"></p>
        </section>
      </div>
    </main>
  </div>

  <template id="slot-template">
    <li class="slot">
      <time></time>
      <div><p class="slot-state"></p><p class="person"></p></div>
      <button type="button">Записаться</button>
    </li>
  </template>

  <script>
    "use strict";

    const dates = new Intl.DateTimeFormat("ru-RU", { dateStyle: "long", timeZone: "Europe/Moscow" });
    const times = new Intl.DateTimeFormat("ru-RU", {
      day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Moscow",
    });
    const slotList = document.getElementById("slots");
    const slotTemplate = document.getElementById("slot-template");
    const walkDate = document.getElementById("walk-date");
    const bookingForm = document.getElementById("booking-form");
    const bookingName = document.getElementById("booking-name");
    const bookingStatus = document.getElementById("booking-status");
    const feedingName = document.getElementById("feeding-name");
    const feedingTime = document.getElementById("feeding-time");
    const feedingForm = document.getElementById("feeding-form");
    const feedingEmployee = document.getElementById("feeding-employee");
    const feedingStatus = document.getElementById("feeding-status");
    let currentDate;
    let selectedTime;

    function showMessage(target, text, error = false) {
      target.textContent = text;
      target.classList.toggle("error", error);
    }

    function render(data) {
      currentDate = data.date;
      walkDate.dateTime = currentDate;
      walkDate.textContent = dates.format(new Date(currentDate + "T12:00:00+03:00"));
      const rows = data.slots.map(({ time, name }) => {
        const row = slotTemplate.content.firstElementChild.cloneNode(true);
        row.querySelector("time").dateTime = time;
        row.querySelector("time").textContent = time;
        row.querySelector(".slot-state").textContent = name ? "Занято" : "Свободно";
        row.querySelector(".person").textContent = name ?? "";
        row.classList.toggle("occupied", Boolean(name));
        const button = row.querySelector("button");
        button.hidden = Boolean(name);
        button.setAttribute("aria-label", "Записаться на " + time);
        button.addEventListener("click", () => {
          selectedTime = time;
          document.getElementById("booking-title").textContent = "Запись на " + time;
          bookingForm.hidden = false;
          showMessage(bookingStatus, "");
          bookingName.focus();
        });
        return row;
      });
      slotList.replaceChildren(...rows);

      feedingName.textContent = data.feeding?.name ?? "Отметок пока нет";
      feedingTime.hidden = !data.feeding;
      if (data.feeding) {
        feedingTime.dateTime = data.feeding.time;
        feedingTime.textContent = times.format(new Date(data.feeding.time)) + " (МСК)";
      }
    }

    async function post(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      return { response, data: await response.json() };
    }

    bookingForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = bookingForm.querySelector("button");
      submit.disabled = true;
      try {
        const { response, data } = await post("/api/walk", {
          date: currentDate, time: selectedTime, name: bookingName.value,
        });
        if (data.state) render(data.state);
        if (response.ok || response.status === 409) {
          bookingForm.hidden = true;
        }
        if (response.ok) bookingForm.reset();
        showMessage(bookingStatus, data.message, !response.ok);
      } catch {
        showMessage(bookingStatus, "Не удалось связаться с сервером. Попробуйте ещё раз.", true);
      } finally {
        submit.disabled = false;
      }
    });

    feedingForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = feedingForm.querySelector("button");
      submit.disabled = true;
      try {
        const { response, data } = await post("/api/feeding", { name: feedingEmployee.value });
        if (response.ok) {
          render(data.state);
          feedingForm.reset();
        }
        showMessage(feedingStatus, data.message, !response.ok);
      } catch {
        showMessage(feedingStatus, "Не удалось связаться с сервером. Попробуйте ещё раз.", true);
      } finally {
        submit.disabled = false;
      }
    });

    async function load() {
      try {
        const response = await fetch("/api/state");
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        render(data);
        showMessage(bookingStatus, "");
      } catch {
        showMessage(bookingStatus, "Не удалось загрузить прогулки. Обновите страницу.", true);
      }
    }

    load();
  </script>
</body>
</html>
